name: Publish

# A v* tag publishes that version to GitHub Packages. The tag must match package.json's version,
# so what a consumer pins is what the tag holds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, arm64, codebuild, small]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The handler runs on Lambda's Node 22, and the runners carry the newest Node (26), on which
      # jest 29 ran out of memory: test on the runtime's.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What production installs is what was reviewed: a tag on a commit that never reached master
      # publishes nothing.
      - name: The tag is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }
      - name: The tag is package.json's version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish
