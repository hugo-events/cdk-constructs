name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, arm64, codebuild, small]
    steps:
      - uses: actions/checkout@v4
      # The handler runs on Lambda's Node 22, and the runners carry the newest Node (26), on which
      # jest 29 ran out of memory: test on the runtime's.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check
        run: npx tsc -p tsconfig.json
      - name: Test
        run: npx jest
