name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, arm64, codebuild, small]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # builds, bundles the handlers, type-checks and runs jest
      - run: npm test
