name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted, never our self-hosted runners: the repository is public, and a fork's pull
    # request would run its code on them (QB-4151). Nothing here needs our AWS account.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The handler runs on Lambda's Node 22: test on the runtime's.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check
        run: npx tsc -p tsconfig.json
      - name: Test
        run: npx jest
